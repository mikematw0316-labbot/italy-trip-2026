  /* ── sticky day switcher ── */

    position:sticky; top:0; z-index:50;

    padding:env(safe-area-inset-top) 0 0;

  .daynav-inner{
    display:flex; gap:.4rem; overflow-x:auto; scroll-snap-type:x proximity;
    padding:.6rem .9rem; height:var(--nav-h);
    scrollbar-width:none;
  }
  .daynav-inner::-webkit-scrollbar{display:none}
  .chip{
    scroll-snap-align:center; flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:52px; padding:.25rem .6rem; border-radius:12px;
    background:var(--card); border:1px solid var(--line);
    text-decoration:none; color:var(--ink-soft);
    transition:transform var(--dur) var(--ease), background var(--dur), color var(--dur), border-color var(--dur);
  }
  .chip .cd{font-size:.62rem; letter-spacing:.02em; line-height:1.1}
  .chip .cn{font-family:'Playfair Display',serif; font-weight:800; font-size:1.05rem; line-height:1}
  .chip[data-c="milan"] .cn{color:var(--milan)} .chip[data-c="venice"] .cn{color:var(--venice)}
  .chip[data-c="florence"] .cn{color:var(--florence)} .chip[data-c="rome"] .cn{color:var(--rome)}
  .chip[data-c="transit"] .cn{color:var(--transit)}
  .chip.active{color:#fff; transform:translateY(-1px)}
  .chip.active[data-c="milan"]{background:var(--milan);border-color:var(--milan)}
  .chip.active[data-c="venice"]{background:var(--venice);border-color:var(--venice)}
  .chip.active[data-c="florence"]{background:var(--florence);border-color:var(--florence)}
  .chip.active[data-c="rome"]{background:var(--rome);border-color:var(--rome)}
  .chip.active[data-c="transit"]{background:var(--transit);border-color:var(--transit)}
  .chip.active .cn{color:#fff}

  .masthead{padding:2.4rem 1.2rem 1.2rem; text-align:center}
  .masthead .kick{font-size:.72rem; letter-spacing:.42em; text-transform:uppercase; color:var(--gold); font-weight:700}

  .masthead h1 em{font-style:italic; color:var(--florence)}
  .masthead .meta{font-size:.82rem; color:var(--ink-soft); letter-spacing:.05em}

  /* ── day section ── */
  .day{

  .tag.plan{background:rgba(120,110,100,.14); color:#6b6258}

  .meal .mnote{font-size:.76rem; color:var(--ink-soft); margin-top:.2rem}

  .info-line .ic{flex:0 0 auto; font-size:1rem}

    background:var(--ink); color:var(--paper); font-size:1.1rem; cursor:pointer;
    box-shadow:var(--shadow); opacity:0; pointer-events:none;

    }

</style>

  move:"✈ 羅馬 Fiumicino 08:35 起飛 → 慕尼黑轉機 → 台北(前一晚飯店代叫計程車)",hotelKey:null},
 {n:17,date:"10/11",dow:"日",c:"transit",city:"抵達台北",title:"06:35 落地 · 回台中",
  move:"🏠 06:35 抵台北 T2,返回台中,旅程圓滿。",hotelKey:null},
];

function ticketRows(ts){
  return ts.map(t=>`<div class="row">
    <div class="time">${t.t}</div>
    <div class="body"><div class="nm">${t.url?`<a href="${t.url}" target="_blank" rel="noopener">${t.nm}</a>`:t.nm}</div>
    ${t.sub?`<div class="sub">${t.sub}</div>`:""}</div></div>`).join("");
}
function mealCard(type,m){
  if(!m) return "";
  return `<div class="meal">
    <div class="mh"><span class="mtype">${type}</span><span class="mtime">${m.t||""}</span></div>
    <div class="mname"><a href="${map(m.nm+" "+ (m.city||""))}" target="_blank" rel="noopener">${m.nm}</a>
      ${m.badge==="ok"?'<span class="tag ok">已訂位</span>':m.badge==="warn"?'<span class="tag warn">需注意</span>':'<span class="tag plan">計畫</span>'}</div>
    ${m.note?`<div class="mnote">${m.note}</div>`:""}
  </div>`;
}
function dayHTML(d){
  const cityName = d.city || C[d.c];
  const hotel = d.hotelKey ? HOTELS[d.hotelKey] : null;
  let html = `<section class="day" id="d${d.n}" data-c="${d.c}">
    <div class="day-head">
      <div class="day-badge"><span class="b1">Day</span><span class="b2">${d.n}</span></div>
      <div class="h-txt">
        <div class="day-date">${d.date} · 星期${d.dow}</div>
        <div class="day-city">${cityName}</div>
        <div class="day-title">${d.title}</div>
      </div>
    </div>`;
  if(d.move) html += `<div class="move-note"><span>${d.move}</span></div>`;
  if(d.spots&&d.spots.length){
    html += `<div class="block"><div class="block-label">📍 行程重點</div><div class="spots">`+
      d.spots.map(s=>`<a class="spot" href="${map(s+" "+cityName)}" target="_blank" rel="noopener"><span class="pin">●</span>${s}</a>`).join("")+
      `</div></div>`;
  }
  if(d.tickets&&d.tickets.length){
    html += `<div class="block"><div class="block-label">🎟 訂票 · 時段</div><div class="card">${ticketRows(d.tickets)}</div></div>`;
  }
  if(d.lunch||d.dinner){
    html += `<div class="block"><div class="block-label">🍽 餐廳</div><div class="meal-grid">`+
      mealCard("午餐",d.lunch?{...d.lunch,city:cityName}:null)+
      mealCard("晚餐",d.dinner?{...d.dinner,city:cityName}:null)+`</div></div>`;
  }
  if(d.extra){ html += `<div class="block"><div class="card"><div class="info-line"><span>${d.extra}</span></div></div></div>`; }
  if(d.outfit||hotel){
    html += `<div class="block"><div class="block-label">🧳 當日資訊</div><div class="card">`;
    if(d.outfit) html += `<div class="info-line"><span class="ic">👕</span><span><strong>服裝</strong>｜${d.outfit}</span></div>`;
    if(hotel) html += `<div class="info-line"><span class="ic">🏨</span><span><strong>住宿</strong>｜<a href="${map(hotel.name)}" target="_blank" rel="noopener">${hotel.name}</a><br><span style="color:var(--ink-soft);font-size:.82rem">${hotel.addr}</span></span></div>`;
    html += `</div></div>`;
  }
  html += `</section>`;
  return html;
}

// render
document.getElementById("days").innerHTML = DAYS.map(dayHTML).join("");
document.getElementById("daynav").innerHTML = DAYS.map(d=>
  `<a class="chip" data-c="${d.c}" href="#d${d.n}"><span class="cd">${d.date}</span><span class="cn">${d.n}</span></a>`).join("");

// active chip on scroll
const chips = [...document.querySelectorAll(".chip")];
const sections = DAYS.map(d=>document.getElementById("d"+d.n));
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i = sections.indexOf(e.target);
      chips.forEach(c=>c.classList.remove("active"));
      if(chips[i]){ chips[i].classList.add("active");
        chips[i].scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"}); }
    }
  });
},{rootMargin:"-45% 0px -50% 0px",threshold:0});
sections.forEach(s=>io.observe(s));

// back to top
const totop = document.getElementById("totop");
addEventListener("scroll",()=>{ totop.classList.toggle("show", scrollY>600); },{passive:true});
totop.onclick=()=>scrollTo({top:0,behavior:"smooth"});
</script>
</body>
</html>
