<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>義大利每日行程 · 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6f2ea; --ink:#221d17; --ink-soft:#736a5e; --line:#e6ded0;
    --card:#fffdf9; --gold:#b98a3e;
    --milan:#c0392b; --venice:#1f6f8b; --florence:#c9702a; --rome:#8a6d1f; --transit:#7d7468;
    --nav-h:46px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC',system-ui,sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }

  /* ── top day switcher (fixed) ── */
  .daynav{
    position:fixed; top:0; left:0; right:0; z-index:50; height:calc(var(--nav-h) + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top);
    background:rgba(246,242,234,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  }
  .daynav-inner{display:flex; gap:.35rem; overflow-x:auto; padding:.4rem .6rem; height:var(--nav-h); scrollbar-width:none}
  .daynav-inner::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:.3rem; height:34px; padding:0 .6rem;
    border-radius:10px; background:var(--card); border:1px solid var(--line);
    text-decoration:none; color:var(--ink-soft); font-size:.72rem; font-weight:700;
    transition:background .3s, color .3s, border-color .3s;
  }
  .chip .cn{font-family:'Playfair Display',serif; font-weight:900; font-size:.95rem}
  .chip[data-c="milan"] .cn{color:var(--milan)} .chip[data-c="venice"] .cn{color:var(--venice)}
  .chip[data-c="florence"] .cn{color:var(--florence)} .chip[data-c="rome"] .cn{color:var(--rome)}
  .chip[data-c="transit"] .cn{color:var(--transit)}
  .chip.active{color:#fff}
  .chip.active .cn{color:#fff}
  .chip.active[data-c="milan"]{background:var(--milan);border-color:var(--milan)}
  .chip.active[data-c="venice"]{background:var(--venice);border-color:var(--venice)}
  .chip.active[data-c="florence"]{background:var(--florence);border-color:var(--florence)}
  .chip.active[data-c="rome"]{background:var(--rome);border-color:var(--rome)}
  .chip.active[data-c="transit"]{background:var(--transit);border-color:var(--transit)}

  /* ── slide deck ── */
  .deck{
    height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory;
    scroll-behavior:smooth; scrollbar-width:none;
  }
  .deck::-webkit-scrollbar{display:none}
  .slide{
    height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
    position:relative; overflow:hidden;
    padding:calc(var(--nav-h) + env(safe-area-inset-top) + .5rem) 1.05rem calc(1rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }
  .slide[data-c="milan"]{--accent:var(--milan)} .slide[data-c="venice"]{--accent:var(--venice)}
  .slide[data-c="florence"]{--accent:var(--florence)} .slide[data-c="rome"]{--accent:var(--rome)}
  .slide[data-c="transit"]{--accent:var(--transit)}
  .slide::before{  /* soft city-tint top wash */
    content:""; position:absolute; inset:0 0 auto 0; height:42%;
    background:linear-gradient(180deg, color-mix(in oklab, var(--accent) 14%, transparent), transparent);
    pointer-events:none;
  }
  .wm{ /* giant faint day number */
    position:absolute; right:-.5rem; top:calc(var(--nav-h) + 8%); z-index:0;
    font-family:'Playfair Display',serif; font-weight:900; font-size:44vw; line-height:.8;
    color:var(--accent); opacity:.07; pointer-events:none; user-select:none;
  }
  .content{position:relative; z-index:1; display:flex; flex-direction:column; height:100%; min-height:0; justify-content:space-between; gap:.3rem}

  /* header */
  .s-head{display:flex; align-items:center; gap:.6rem}
  .s-daytag{font-family:'Playfair Display',serif; font-weight:900; font-size:.9rem; color:var(--accent);
    border:1.5px solid var(--accent); border-radius:8px; padding:.05rem .45rem}
  .s-date{font-size:.82rem; color:var(--ink-soft); font-weight:700}
  .s-city{font-family:'Playfair Display',serif; font-weight:900; font-size:clamp(1.9rem,7.5vw,2.4rem); color:var(--accent); line-height:1.05; margin-top:.35rem}
  .s-title{font-size:.98rem; font-weight:700; line-height:1.4; margin-top:.15rem}
  .s-title.big{font-size:1.15rem}

  /* generic compact block */
  .grp{margin-top:.7rem}
  .lbl{font-size:.64rem; font-weight:900; letter-spacing:.16em; color:var(--ink-soft); margin-bottom:.35rem; display:flex; align-items:center; gap:.35rem}

  .spots{display:flex; flex-wrap:wrap; gap:.32rem}
  .spot{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:.22rem .6rem;
    font-size:.8rem; font-weight:500; color:var(--ink); text-decoration:none; display:inline-flex; align-items:center; gap:.28rem}
  .spot .pin{color:var(--accent); font-size:.6rem}

  .lines{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.35rem .7rem}
  .li{display:flex; gap:.55rem; align-items:baseline; padding:.3rem 0; border-bottom:1px dashed var(--line); font-size:.85rem}
  .li:last-child{border-bottom:0}
  .li .t{flex:0 0 auto; font-family:'Playfair Display',serif; font-weight:700; color:var(--accent); min-width:56px; font-size:.85rem}
  .li .x{flex:1; min-width:0}
  .li .x .n{font-weight:700}
  .li .x .n a{color:inherit; text-decoration:none; border-bottom:1.5px solid var(--accent)}
  .li .x .s{font-size:.72rem; color:var(--ink-soft)}
  .tag{font-size:.6rem; font-weight:800; padding:.05rem .35rem; border-radius:5px; margin-left:.3rem; white-space:nowrap}
  .tag.ok{background:rgba(40,140,70,.15); color:#2e7d46}
  .tag.warn{background:rgba(200,120,20,.18); color:#b3670e}
  .tag.plan{background:rgba(120,110,100,.15); color:#6b6258}

  /* footer strip: outfit + hotel */
  .strip{padding-top:.5rem; display:flex; flex-direction:column; gap:.3rem}
  .fx{display:flex; gap:.5rem; align-items:flex-start; font-size:.8rem; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.4rem .6rem}
  .fx .ic{flex:0 0 auto}
  .fx a{color:var(--accent); text-decoration:none; font-weight:700}
  .fx .ad{color:var(--ink-soft); font-size:.72rem}

  /* transit / sparse day hero */
  .hero-mid{flex:1; display:flex; flex-direction:column; justify-content:center; gap:.9rem; text-align:center}
  .hero-mid .big-ic{font-size:3.2rem}
  .hero-mid .move-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem 1.1rem; font-size:.95rem; line-height:1.6}

  .counter{position:fixed; right:.8rem; bottom:calc(.7rem + env(safe-area-inset-bottom)); z-index:40;
    font-size:.72rem; font-weight:800; color:#fff; background:rgba(34,29,23,.7); padding:.2rem .55rem; border-radius:999px; backdrop-filter:blur(6px)}
  .hint{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(.7rem + env(safe-area-inset-bottom)); z-index:40;
    font-size:.72rem; color:var(--ink-soft); animation:bob 1.6s var(--ease) infinite; transition:opacity .4s}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#15120e; --ink:#f1eadd; --ink-soft:#a99f8f; --line:#332c22; --card:#1f1a13}
  }
</style>
</head>

function tik(ts){return `<div class="grp"><div class="lbl">🎟 訂票時段</div><div class="lines">`+
  ts.map(t=>`<div class="li"><span class="t">${t.t}</span><span class="x"><span class="n">${t.u?`<a href="${t.u}" target="_blank" rel="noopener">${t.n}</a>`:t.n}</span>${t.s?`<span class="s"> ${t.s}</span>`:""}</span></div>`).join("")+`</div></div>`;}
function meals(d,city){
  const row=(lab,m)=> m?`<div class="li"><span class="t">${lab} ${m.t}</span><span class="x"><span class="n"><a href="${map(m.n+" "+city)}" target="_blank" rel="noopener">${m.n}</a></span><span class="tag ${m.b}">${m.b==="ok"?"已訂":m.b==="warn"?"注意":"計畫"}</span>${m.s?`<span class="s"> ${m.s}</span>`:""}</span></div>`:"";
  if(!d.lunch&&!d.dinner) return "";
  return `<div class="grp"><div class="lbl">🍽 餐廳</div><div class="lines">${row("午",d.lunch)}${row("晚",d.dinner)}</div></div>`;
}
function slideHTML(d){
  const city=d.city||C[d.c];
  const h=d.hotelKey?HOTELS[d.hotelKey]:null;
  const isSparse = !d.spots && (d.move || d.ic);
  let inner;
  if(isSparse){
    inner = `<div class="s-head"><span class="s-daytag">DAY ${d.n}</span><span class="s-date">${d.date} · 星期${d.dow}</span></div>
      <div class="hero-mid">
        <div class="big-ic">${d.ic||"✈️"}</div>
        <div class="s-city" style="font-size:clamp(2rem,9vw,2.8rem)">${city}</div>
        <div class="s-title big">${d.title}</div>
        <div class="move-card">${d.move||""}</div>
      </div>`;
  } else {
    inner = `<div class="s-head"><span class="s-daytag">DAY ${d.n}</span><span class="s-date">${d.date} · 星期${d.dow}</span></div>
      <div class="s-city">${city}</div>
      <div class="s-title">${d.title}</div>`;
    if(d.move) inner += `<div class="grp"><div class="lines"><div class="li"><span class="x">${d.move}</span></div></div></div>`;
    if(d.spots) inner += `<div class="grp"><div class="lbl">📍 行程重點</div><div class="spots">`+
      d.spots.map(s=>`<a class="spot" href="${map(s+" "+city)}" target="_blank" rel="noopener"><span class="pin">●</span>${s}</a>`).join("")+`</div></div>`;
    if(d.tickets) inner += tik(d.tickets);
    inner += meals(d,city);
    if(d.note) inner += `<div class="grp"><div class="lines"><div class="li"><span class="x">💡 ${d.note}</span></div></div></div>`;
    inner += `<div class="strip">`;
    if(d.outfit){
      const lb = (d.n>=2 && d.n<=15) ? `https://mikematw0316-labbot.github.io/italy-outfit-lookbook/#day-${String(d.n-1).padStart(2,"0")}` : null;
      inner += `<div class="fx"><span class="ic">👕</span><span><b>服裝</b>　${lb?`<a href="${lb}" target="_blank" rel="noopener">${d.outfit} · 看穿搭型錄 →</a>`:d.outfit}</span></div>`;
    }
    if(h) inner += `<div class="fx"><span class="ic">🏨</span><span><a href="${map(h.name)}" target="_blank" rel="noopener">${h.name}</a><br><span class="ad">${h.addr}</span></span></div>`;
    inner += `</div>`;
  }
  return `<section class="slide" id="d${d.n}" data-c="${d.c}"><div class="wm">${d.n}</div><div class="content">${inner}</div></section>`;
}

document.getElementById("deck").innerHTML = DAYS.map(slideHTML).join("");
document.getElementById("daynav").innerHTML = DAYS.map(d=>
  `<a class="chip" data-c="${d.c}" href="#d${d.n}"><span class="cn">${d.n}</span><span>${d.date}</span></a>`).join("");

const deck=document.getElementById("deck");
const chips=[...document.querySelectorAll(".chip")];
const slides=DAYS.map(d=>document.getElementById("d"+d.n));
const counter=document.getElementById("counter");
const hint=document.getElementById("hint");

// smooth anchor jump inside the scroll container (avoid page-level jump under fixed nav)
chips.forEach((c,i)=>c.addEventListener("click",e=>{e.preventDefault(); slides[i].scrollIntoView({behavior:"smooth"});}));

const io=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){
  const i=slides.indexOf(e.target);
  chips.forEach(c=>c.classList.remove("active"));
  if(chips[i]){chips[i].classList.add("active"); chips[i].scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});}
  counter.textContent=(i+1)+" / "+DAYS.length;
  hint.style.opacity = i===0 ? "1":"0";
}});},{root:deck,threshold:.55});
slides.forEach(s=>io.observe(s));
</script>
</body>
</html>
