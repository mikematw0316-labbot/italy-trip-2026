<style>
  :root{
    --paper:#f6f2ea; --ink:#221d17; --ink-soft:#736a5e; --line:#e6ded0;
    --card:#fffdf9; --gold:#b98a3e;
    --lock:#ffe64a; --lock-edge:#e9c400; --lock-ink:#3a2e05;
    --milan:#c0392b; --venice:#1f6f8b; --florence:#c9702a; --rome:#8a6d1f; --transit:#7d7468;
    --nav-h:46px; --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--paper); color:var(--ink); font-family:'Noto Sans TC',system-ui,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased; overflow:hidden}

  .daynav{position:fixed; top:0; left:0; right:0; z-index:50; height:calc(var(--nav-h) + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top); background:rgba(246,242,234,.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
  .daynav-inner{display:flex; gap:.35rem; overflow-x:auto; padding:.4rem .6rem; height:var(--nav-h); scrollbar-width:none}
  .daynav-inner::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; display:flex; align-items:center; gap:.3rem; height:34px; padding:0 .6rem; border-radius:10px;
    background:var(--card); border:1px solid var(--line); text-decoration:none; color:var(--ink-soft); font-size:.72rem; font-weight:700;
    transition:background .3s,color .3s,border-color .3s}
  .chip .cn{font-family:'Playfair Display',serif; font-weight:900; font-size:.95rem}
  .chip[data-c="milan"] .cn{color:var(--milan)} .chip[data-c="venice"] .cn{color:var(--venice)}
  .chip[data-c="florence"] .cn{color:var(--florence)} .chip[data-c="rome"] .cn{color:var(--rome)} .chip[data-c="transit"] .cn{color:var(--transit)}
  .chip.active{color:#fff} .chip.active .cn{color:#fff}
  .chip.active[data-c="milan"]{background:var(--milan);border-color:var(--milan)}
  .chip.active[data-c="venice"]{background:var(--venice);border-color:var(--venice)}
  .chip.active[data-c="florence"]{background:var(--florence);border-color:var(--florence)}
  .chip.active[data-c="rome"]{background:var(--rome);border-color:var(--rome)}
  .chip.active[data-c="transit"]{background:var(--transit);border-color:var(--transit)}
  .chip.is-today::after{content:"今日"; font-size:.52rem; font-weight:900; background:var(--lock); color:var(--lock-ink); padding:.02rem .2rem; border-radius:4px; margin-left:.1rem}
  .todaypill{display:inline-block; font-size:.6rem; font-weight:900; background:var(--lock); color:var(--lock-ink); padding:.05rem .4rem; border-radius:6px; margin-left:.4rem; vertical-align:middle}

  .deck{height:100dvh; overflow-y:scroll; scroll-snap-type:y mandatory; scroll-behavior:smooth; scrollbar-width:none}
  .deck::-webkit-scrollbar{display:none}
  .slide{height:100dvh; scroll-snap-align:start; scroll-snap-stop:always; position:relative; overflow:hidden;
    padding:calc(var(--nav-h) + env(safe-area-inset-top) + .5rem) 1rem calc(.8rem + env(safe-area-inset-bottom));
    display:flex; flex-direction:column}
  .slide[data-c="milan"]{--accent:var(--milan)} .slide[data-c="venice"]{--accent:var(--venice)}
  .slide[data-c="florence"]{--accent:var(--florence)} .slide[data-c="rome"]{--accent:var(--rome)} .slide[data-c="transit"]{--accent:var(--transit)}
  .slide::before{content:""; position:absolute; inset:0 0 auto 0; height:38%;
    background:linear-gradient(180deg,color-mix(in oklab,var(--accent) 13%,transparent),transparent); pointer-events:none}
  .wm{position:absolute; right:-.4rem; top:calc(var(--nav-h) + 6%); z-index:0; font-family:'Playfair Display',serif;
    font-weight:900; font-size:42vw; line-height:.8; color:var(--accent); opacity:.06; pointer-events:none; user-select:none}
  .content{position:relative; z-index:1; display:flex; flex-direction:column; height:100%; min-height:0}

  .s-head{display:flex; align-items:center; gap:.55rem}
  .s-daytag{font-family:'Playfair Display',serif; font-weight:900; font-size:.85rem; color:var(--accent);
    border:1.5px solid var(--accent); border-radius:8px; padding:.03rem .45rem}
  .s-date{font-size:.8rem; color:var(--ink-soft); font-weight:700}
  .s-city{font-family:'Playfair Display',serif; font-weight:900; font-size:clamp(1.7rem,6.8vw,2.2rem); color:var(--accent); line-height:1.05; margin-top:.25rem}
  .s-title{font-size:.9rem; font-weight:700; color:var(--ink-soft); line-height:1.35; margin-top:.1rem}

  /* timeline */
  .tl{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-between; gap:.4rem; margin:.55rem 0; padding:.2rem 0}
  .ev{display:flex; gap:.5rem; align-items:stretch; background:var(--card); border:1px solid var(--line);
    border-radius:11px; padding:.4rem .55rem; text-decoration:none; color:var(--ink)}
  .ev .et{flex:0 0 auto; width:50px; text-align:center; font-family:'Playfair Display',serif; font-weight:700;
    font-size:.9rem; color:var(--accent); display:flex; flex-direction:column; justify-content:center; line-height:1}
  .ev .eb{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center}
  .ev .en{font-size:.9rem; font-weight:700; line-height:1.25; display:flex; align-items:center; gap:.3rem; flex-wrap:wrap}
  .ev .es{font-size:.7rem; color:var(--ink-soft); line-height:1.3; margin-top:.05rem}
  .ico{flex:0 0 auto; font-size:.78rem}
  .tag{font-size:.6rem; font-weight:800; padding:.03rem .32rem; border-radius:5px; white-space:nowrap}
  .tag.ok{background:rgba(40,140,70,.15); color:#2e7d46}
  .tag.warn{background:rgba(200,120,20,.18); color:#b3670e}
  .tag.plan{background:rgba(120,110,100,.14); color:#6b6258}

  /* LOCKED (purchased ticket / booked train) — bright yellow emphasis */
  .ev.lock{background:linear-gradient(90deg,#fff6bf,var(--lock)); border-color:var(--lock-edge);
    box-shadow:0 3px 10px -3px rgba(220,180,10,.55)}
  .ev.lock .et{color:var(--lock-ink)}
  .ev.lock .en{color:var(--lock-ink)}
  .ev.lock .es{color:#6b5a12}
  .ev.lock .lockpill{font-size:.58rem; font-weight:900; background:var(--lock-ink); color:var(--lock);
    padding:.03rem .34rem; border-radius:5px; letter-spacing:.03em}

  .strip{display:flex; flex-direction:column; gap:.28rem}
  .fx{display:flex; gap:.45rem; align-items:flex-start; font-size:.78rem; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:.35rem .55rem}
  .fx a{color:var(--accent); text-decoration:none; font-weight:700}
  .fx .ad{color:var(--ink-soft); font-size:.7rem}

  /* transit hero */
  .hero-mid{flex:1; display:flex; flex-direction:column; justify-content:center; gap:.9rem; text-align:center}
  .hero-mid .big-ic{font-size:3.2rem}
  .hero-mid .move-card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:1rem; font-size:.95rem; line-height:1.6}

  .counter{position:fixed; right:.8rem; bottom:calc(.7rem + env(safe-area-inset-bottom)); z-index:40; font-size:.72rem;
    font-weight:800; color:#fff; background:rgba(34,29,23,.7); padding:.2rem .55rem; border-radius:999px; backdrop-filter:blur(6px)}
  .hint{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(.7rem + env(safe-area-inset-bottom)); z-index:40;
    font-size:.72rem; color:var(--ink-soft); animation:bob 1.6s var(--ease) infinite; transition:opacity .4s}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,4px)}}

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){--paper:#15120e; --ink:#f1eadd; --ink-soft:#a99f8f; --line:#332c22; --card:#1f1a13}
  }
</style>

  const clickable = e.u || e.k==="spot" || e.k==="meal";
  const href = e.u ? e.u : (e.k==="spot"||e.k==="meal") ? map(e.n.replace(/^(午餐|晚餐)\s?/,"")+" "+city) : null;
  const tagHTML = e.tag?`<span class="tag ${e.tag}">${e.tag==="ok"?"已訂":e.tag==="warn"?"注意":"計畫"}</span>`:"";
  const lockHTML = e.lock?`<span class="lockpill">定時·購票</span>`:"";
  const inner = `<span class="et">${e.t}</span><span class="eb"><span class="en"><span class="ico">${ICON[e.k]||"•"}</span>${e.n}${lockHTML}${tagHTML}</span>${e.s?`<span class="es">${e.s}</span>`:""}</span>`;
  return href
    ? `<a class="ev ${e.lock?"lock":""}" href="${href}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="ev ${e.lock?"lock":""}">${inner}</div>`;
}
function slideHTML(d){
  const city=d.city||C[d.c]; const h=d.hotelKey?HOTELS[d.hotelKey]:null;
  let inner;
  if(!d.plan){
    inner = `<div class="s-head"><span class="s-daytag">DAY ${d.n}</span><span class="s-date">${d.date} · 星期${d.dow}</span></div>
      <div class="hero-mid"><div class="big-ic">${d.ic||"✈️"}</div>
        <div class="s-city" style="font-size:clamp(2rem,9vw,2.8rem)">${city}</div>
        <div class="s-title" style="color:var(--ink);font-size:1.1rem">${d.title}</div>
        <div class="move-card">${d.move||""}</div></div>`;
  } else {
    inner = `<div class="s-head"><span class="s-daytag">DAY ${d.n}</span><span class="s-date">${d.date} · 星期${d.dow}</span></div>
      <div class="s-city">${city}</div><div class="s-title">${d.title}</div>
      <div class="tl">${d.plan.map(e=>evHTML(e,city)).join("")}</div>
      <div class="strip">`;
    if(d.outfit){
      const lb=(d.n>=2&&d.n<=15)?`https://mikematw0316-labbot.github.io/italy-outfit-lookbook/#day-${String(d.n-1).padStart(2,"0")}`:null;
      inner += `<div class="fx"><span>👕</span><span><b>服裝</b>　${lb?`<a href="${lb}" target="_blank" rel="noopener">${d.outfit} · 看穿搭型錄 →</a>`:d.outfit}</span></div>`;
    }
    if(h) inner += `<div class="fx"><span>🏨</span><span><a href="${map(h.name)}" target="_blank" rel="noopener">${h.name}</a> <span class="ad">· ${h.addr}</span></span></div>`;
    inner += `</div>`;
  }
  return `<section class="slide" id="d${d.n}" data-c="${d.c}"><div class="wm">${d.n}</div><div class="content">${inner}</div></section>`;
}

document.getElementById("deck").innerHTML = DAYS.map(slideHTML).join("");
document.getElementById("daynav").innerHTML = DAYS.map(d=>
  `<a class="chip" data-c="${d.c}" href="#d${d.n}"><span class="cn">${d.n}</span><span>${d.date}</span></a>`).join("");

const deck=document.getElementById("deck"), chips=[...document.querySelectorAll(".chip")];
const slides=DAYS.map(d=>document.getElementById("d"+d.n));
const counter=document.getElementById("counter"), hint=document.getElementById("hint");
chips.forEach((c,i)=>c.addEventListener("click",e=>{e.preventDefault(); slides[i].scrollIntoView({behavior:"smooth"});}));
const io=new IntersectionObserver(es=>{es.forEach(e=>{ if(e.isIntersecting){
  const i=slides.indexOf(e.target);
  chips.forEach(c=>c.classList.remove("active"));
  if(chips[i]){chips[i].classList.add("active"); chips[i].scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});}
  counter.textContent=(i+1)+" / "+DAYS.length; hint.style.opacity=i===0?"1":"0";
}});},{root:deck,threshold:.55});
slides.forEach(s=>io.observe(s));

// ── 偵測今天,開啟自動跳到當天 ──
const _toD=s=>{const[m,d]=s.split("/").map(Number); return new Date(2026,m-1,d).getTime();};
const _now=new Date();
const _cmp=new Date(2026,_now.getMonth(),_now.getDate()).getTime(); // 以行程年份 2026 對月/日
const exactIdx=DAYS.findIndex(d=>_toD(d.date)===_cmp);              // 恰為旅程中某天,否則 -1
const tIdx = exactIdx>=0 ? exactIdx
  : _cmp < _toD(DAYS[0].date) ? 0                                   // 行程前 → 第 1 天
  : _cmp > _toD(DAYS[DAYS.length-1].date) ? DAYS.length-1           // 行程後 → 最後一天
  : 0;
if(exactIdx>=0){                                                    // 只有真的是今天才標「今日」
  chips[exactIdx].classList.add("is-today");
  const th=slides[exactIdx].querySelector(".s-date");
  if(th) th.insertAdjacentHTML("beforeend",' <span class="todaypill">今日</span>');
}
// 開啟即定位到今天(不用平滑,直接開在那頁)
requestAnimationFrame(()=>{
  slides[tIdx].scrollIntoView({behavior:"auto"});
  chips[tIdx].scrollIntoView({behavior:"auto",inline:"center",block:"nearest"});
  counter.textContent=(tIdx+1)+" / "+DAYS.length;
});
</script>
</body>
</html>
